<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SunuConnect</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f4f7;
      color: #222;
    }

    header {
      background: #008f5a;
      color: white;
      padding: 18px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 25px;
    }

    header p {
      margin-top: 5px;
      font-size: 14px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 15px;
    }

    .publication-box,
    .post {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    textarea {
      width: 100%;
      height: 90px;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      resize: none;
      font-size: 15px;
    }

    button {
      background: #008f5a;
      color: white;
      border: none;
      padding: 11px 18px;
      border-radius: 8px;
      margin-top: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .post-header {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .post-text {
      margin: 10px 0;
      line-height: 1.5;
    }

    .actions {
      border-top: 1px solid #eee;
      padding-top: 10px;
    }

    .like-btn {
      background: #eee;
      color: #333;
      margin-right: 8px;
    }

    .like-btn.active {
      background: #008f5a;
      color: white;
    }

    .comments {
      margin-top: 10px;
    }

    .comment-input {
      width: 100%;
      padding: 9px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-top: 8px;
    }

    .comment {
      background: #f5f5f5;
      padding: 8px;
      border-radius: 8px;
      margin-top: 6px;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>🌍 SunuConnect</h1>
  <p>Le réseau social de notre communauté</p>
</header>

<div class="container">

  <div class="publication-box">
    <h3>📝 Que voulez-vous partager ?</h3>

    <textarea id="publication"
      placeholder="Écrivez votre publication..."></textarea>

    <button onclick="publier()">Publier</button>
