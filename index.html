<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunuConnect</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🌍 SunuConnect</h1>
    <p>Le réseau social de notre communauté</p>
</header>

<main>

    <!-- CONNEXION -->
    <section id="connexion" class="auth-box">
        <h2>🔐 Se connecter</h2>

        <input
            type="email"
            id="emailConnexion"
            placeholder="Votre adresse e-mail"
        >

        <input
            type="password"
            id="passwordConnexion"
            placeholder="Votre mot de passe"
        >

        <button onclick="seConnecter()">Se connecter</button>

        <p>
            Pas encore de compte ?
            <button class="link-btn" onclick="afficherInscription()">
                Créer un compte
            </button>
        </p>
    </section>

    <!-- INSCRIPTION -->
    <section id="inscription" class="auth-box" style="display:none;">
        <h2>👤 Créer un compte</h2>

        <input
            type="text"
            id="nomInscription"
            placeholder="Votre nom"
        >

        <input
            type="email"
            id="emailInscription"
            placeholder="Votre adresse e-mail"
        >

        <input
            type="password"
            id="passwordInscription"
            placeholder="Choisissez un mot de passe"
        >

        <button onclick="sInscrire()">Créer mon compte</button>

        <p>
            Vous avez déjà un compte ?
            <button class="link-btn" onclick="afficherConnexion()">
                Se connecter
            </button>
        </p>
    </section>

    <!-- ESPACE MEMBRE -->
    <section id="espaceMembre" style="display:none;">

        <div class="member-header">
            <h2>👋 Bienvenue <span id="nomUtilisateur"></span></h2>
            <button onclick="seDeconnecter()">🚪 Déconnexion</button>
        </div>

        <section class="publication">
            <h2>📝 Que voulez-vous partager ?</h2>

            <textarea
                id="publicationTexte"
                placeholder="Écrivez votre publication..."
            ></textarea>

            <button onclick="publier()">Publier</button>
        </section>

        <section>
            <h2>📢 Publications</h2>
            <div id="listePublications"></div>
        </section>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>
</html>
